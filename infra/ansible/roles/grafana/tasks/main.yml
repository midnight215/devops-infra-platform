---
- name: Install dependencies
  apt:
    name:
      - wget
      - apt-transport-https
      - adduser
      - libfontconfig1
    state: present
    update_cache: yes

- name: Download Grafana .deb
  get_url:
    url: https://dl.grafana.com/oss/release/grafana_12.0.2_amd64.deb
    dest: /tmp/grafana.deb
    mode: '0644'

- name: Install Grafana
  apt:
    deb: /tmp/grafana.deb
    state: present

- name: Enable and start Grafana service
  systemd:
    name: grafana-server
    enabled: yes
    state: started

