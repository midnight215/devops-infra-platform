groups:
- name: node_alerts
  rules:
  - alert: NodeDown
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Node is down"
      description: "Instance $labels.instance is unreachable"

  - alert: NodeCPUHigh
    expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "CPU usage high"
      description: "CPU usage is above 80% for node $labels.instance"

  - alert: NodeMemoryHigh
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 75
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Memory usage high"
      description: "Memory usage is above 75% for node $labels.instance"

  - alert: NodeDiskFull
    expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} * 100 > 85
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "Disk space critical"
      description: "Root filesystem is above 85% usage on node $labels.instance"

