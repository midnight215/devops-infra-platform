- name: Install Prometheus
  apt:
    name: prometheus
    state: present
    update_cache: yes

- name: Create Prometheus config dir
  file:
    path: /etc/prometheus
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"

- name: Create rules dir
  file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus

- name: Deploy prometheus.yml
  template:
    src: prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus

- name: Deploy node alert rules
  copy:
    src: templates/node-alerts.yml
    dest: /etc/prometheus/rules/node-alerts.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart Prometheus

- name: Ensure Prometheus service is started
  systemd:
    name: prometheus
    enabled: yes
    state: started
